<div id="surf-ow-demo">
  <div class="viz-controls">
    <label class="form-label">Pokémon
      <select class="form-select" id="surf-species"><option value="lapras">Lapras</option><option value="blastoise">Blastoise</option></select>
    </label>
    <label class="form-label">Dirección
      <select class="form-select" id="surf-dir"><option value="0">Sur</option><option value="1">Norte</option><option value="2">Oeste</option><option value="3">Este</option></select>
    </label>
  </div>
  <div class="surf-scenes">
    <figure><figcaption>OW original</figcaption><canvas id="surf-original" width="80" height="64" role="img" aria-label="Frame original del Pokémon sin recorte ni jinete"></canvas></figure>
    <figure><figcaption>Composición de montura</figcaption><canvas id="surf-mounted" width="80" height="64" role="img" aria-label="Jugador detrás del Pokémon, con recorte inferior y espuma opcionales"></canvas></figure>
  </div>
  <div class="viz-controls">
    <label class="form-label">Desplazamiento Y del jugador: <output id="surf-y-value" class="tabular-nums">−8 px</output>
      <input class="form-range" id="surf-y" type="range" min="-20" max="4" value="-8">
    </label>
    <label class="form-label">Filas inferiores ocultas: <output id="surf-cut-value" class="tabular-nums">5 px</output>
      <input class="form-range" id="surf-cut" type="range" min="0" max="16" value="5">
    </label>
  </div>
  <div class="viz-controls">
    <label class="form-check"><input class="form-check-input" id="surf-rider" type="checkbox" checked><span class="form-check-label">Jugador</span></label>
    <label class="form-check"><input class="form-check-input" id="surf-front" type="checkbox" checked><span class="form-check-label">Pokémon delante</span></label>
    <label class="form-check"><input class="form-check-input" id="surf-waves" type="checkbox" checked><span class="form-check-label">Espuma</span></label>
  </div>
  <div id="surf-status" class="text-small" aria-live="polite"></div>
</div>

  function pixels(ctx, asset, frame, frameWidth, frameHeight, x, y, flip, visibleRows = frameHeight) {

      for (let px = 0; px < frameWidth; px++) {

    const front = get('front').checked;
    const waves = get('waves').checked;

    const a = get('original').getContext('2d');
    const b = get('mounted').getContext('2d');
    a.clearRect(0,0,80,64);
    b.clearRect(0,0,80,64);

    const mon = () => pixels(b, asset, monFrame, 32, 32, 24, 20, flip, 32-cut);
